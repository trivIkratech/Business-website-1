<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background:#F6F4EF; font-family: sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2DFD7" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#182D32" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="700" fill="#F6F4EF"/>
  <rect width="1000" height="700" fill="url(#grid)" opacity="0.6"/>
  
  <!-- Outer Campus Boundary -->
  <path d="M 100 100 L 900 100 Q 920 100 920 120 L 920 580 Q 920 600 900 600 L 100 600 Q 80 600 80 580 L 80 120 Q 80 100 100 100 Z" fill="#EEEDE7" stroke="#182D32" stroke-width="3" stroke-dasharray="10 5"/>

  <!-- Peripheral Jogging Track & Green Buffer -->
  <path d="M 120 120 L 880 120 L 880 560 L 120 560 Z" fill="#E2E9E3" stroke="#C5A572" stroke-width="2"/>
  <text x="500" y="585" fill="#586365" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="3">1.2 KM RUBBERISED JOGGING LOOP &amp; BIOPHILIC BUFFER</text>

  <!-- Central Water Body & Sunken Lawn -->
  <ellipse cx="500" cy="340" rx="140" ry="85" fill="#D7E6E5" stroke="#182D32" stroke-width="2"/>
  <text x="500" y="335" fill="#182D32" font-size="14" font-weight="bold" text-anchor="middle">CENTRAL REFLECTION POOL</text>
  <text x="500" y="355" fill="#586365" font-size="11" text-anchor="middle">&amp; FLOATING MEDITATION CABANAS</text>

  <!-- Towers 1 to 4 -->
  <!-- Tower A (West) -->
  <g transform="translate(180, 180)" filter="url(#shadow)">
    <rect width="130" height="110" rx="8" fill="#182D32" stroke="#C5A572" stroke-width="2"/>
    <text x="65" y="50" fill="#F6F4EF" font-size="15" font-weight="bold" text-anchor="middle">TOWER 01</text>
    <text x="65" y="70" fill="#C5A572" font-size="11" text-anchor="middle">THE CYPRESS</text>
    <text x="65" y="90" fill="#E2DFD7" font-size="10" text-anchor="middle">G + 28 FLOORS</text>
  </g>

  <!-- Tower B (North) -->
  <g transform="translate(435, 150)" filter="url(#shadow)">
    <rect width="130" height="110" rx="8" fill="#182D32" stroke="#C5A572" stroke-width="2"/>
    <text x="65" y="50" fill="#F6F4EF" font-size="15" font-weight="bold" text-anchor="middle">TOWER 02</text>
    <text x="65" y="70" fill="#C5A572" font-size="11" text-anchor="middle">THE OAKWOOD</text>
    <text x="65" y="90" fill="#E2DFD7" font-size="10" text-anchor="middle">G + 28 FLOORS</text>
  </g>

  <!-- Tower C (East) -->
  <g transform="translate(690, 180)" filter="url(#shadow)">
    <rect width="130" height="110" rx="8" fill="#182D32" stroke="#C5A572" stroke-width="2"/>
    <text x="65" y="50" fill="#F6F4EF" font-size="15" font-weight="bold" text-anchor="middle">TOWER 03</text>
    <text x="65" y="70" fill="#C5A572" font-size="11" text-anchor="middle">THE CEDAR</text>
    <text x="65" y="90" fill="#E2DFD7" font-size="10" text-anchor="middle">G + 28 FLOORS</text>
  </g>

  <!-- Tower D (South) -->
  <g transform="translate(435, 420)" filter="url(#shadow)">
    <rect width="130" height="110" rx="8" fill="#182D32" stroke="#C5A572" stroke-width="2"/>
    <text x="65" y="50" fill="#F6F4EF" font-size="15" font-weight="bold" text-anchor="middle">TOWER 04</text>
    <text x="65" y="70" fill="#C5A572" font-size="11" text-anchor="middle">THE PINE</text>
    <text x="65" y="90" fill="#E2DFD7" font-size="10" text-anchor="middle">G + 28 FLOORS</text>
  </g>

  <!-- Grand Clubhouse (South-West) -->
  <g transform="translate(180, 390)" filter="url(#shadow)">
    <rect width="140" height="120" rx="8" fill="#FFFFFF" stroke="#182D32" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="30" fill="#C5A572" rx="6 6 0 0"/>
    <text x="70" y="20" fill="#182D32" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">CLUB VERDANT</text>
    <text x="70" y="55" fill="#182D32" font-size="13" font-weight="bold" text-anchor="middle">25,000 SQ. FT.</text>
    <text x="70" y="75" fill="#586365" font-size="10" text-anchor="middle">Heated Infinity Pool</text>
    <text x="70" y="92" fill="#586365" font-size="10" text-anchor="middle">Squash &amp; Badminton</text>
    <text x="70" y="108" fill="#586365" font-size="10" text-anchor="middle">Banquet &amp; Sky Lounge</text>
  </g>

  <!-- Sports Arena (South-East) -->
  <g transform="translate(680, 390)" filter="url(#shadow)">
    <rect width="140" height="120" rx="8" fill="#FFFFFF" stroke="#182D32" stroke-width="2"/>
    <rect x="0" y="0" width="140" height="30" fill="#182D32" rx="6 6 0 0"/>
    <text x="70" y="20" fill="#C5A572" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">SPORTS ARENA</text>
    <text x="70" y="55" fill="#182D32" font-size="13" font-weight="bold" text-anchor="middle">OUTDOOR COURTS</text>
    <text x="70" y="75" fill="#586365" font-size="10" text-anchor="middle">Tennis &amp; Pickleball</text>
    <text x="70" y="92" fill="#586365" font-size="10" text-anchor="middle">Half Basketball Court</text>
    <text x="70" y="108" fill="#586365" font-size="10" text-anchor="middle">Kids Adventure Park</text>
  </g>

  <!-- Grand Entrance Gate (North) -->
  <g transform="translate(420, 70)">
    <rect width="160" height="40" rx="4" fill="#182D32"/>
    <text x="80" y="25" fill="#C5A572" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">MAIN BOULEVARD ENTRY</text>
  </g>

  <!-- Compass & Legend -->
  <g transform="translate(860, 140)">
    <circle cx="20" cy="20" r="22" fill="#FFFFFF" stroke="#C5A572" stroke-width="1.5"/>
    <polygon points="20,4 25,20 20,16 15,20" fill="#182D32"/>
    <polygon points="20,36 25,20 20,24 15,20" fill="#C5A572"/>
    <text x="20" y="2" fill="#182D32" font-size="11" font-weight="bold" text-anchor="middle">N</text>
  </g>

  <!-- Title Block -->
  <rect x="80" y="620" width="840" height="50" rx="6" fill="#182D32"/>
  <text x="100" y="650" fill="#C5A572" font-size="14" font-weight="bold" letter-spacing="2">THE VERDANT ESTATE</text>
  <text x="320" y="650" fill="#F6F4EF" font-size="12">MASTER SITE PLAN · 12.5 ACRES · 80% OPEN GREENERY · WHITEFIELD, BENGALURU</text>
</svg>