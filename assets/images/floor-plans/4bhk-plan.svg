<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background:#F6F4EF; font-family: sans-serif;">
  <defs>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2DFD7" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="700" fill="#F6F4EF"/>
  <rect width="1000" height="700" fill="url(#grid4)" opacity="0.6"/>

  <!-- Outer Boundary -->
  <rect x="60" y="50" width="880" height="550" fill="#FFFFFF" stroke="#182D32" stroke-width="4" rx="6"/>

  <!-- Private Elevator Foyer -->
  <rect x="60" y="240" width="120" height="150" fill="#182D32" stroke="#C5A572" stroke-width="2"/>
  <text x="120" y="300" fill="#C5A572" font-size="13" font-weight="bold" text-anchor="middle">PRIVATE</text>
  <text x="120" y="320" fill="#F6F4EF" font-size="12" font-weight="bold" text-anchor="middle">LIFT FOYER</text>
  <text x="120" y="345" fill="#E2DFD7" font-size="10" text-anchor="middle">Direct Access</text>

  <!-- Grand Living, Dining & Family Lounge -->
  <rect x="180" y="160" width="460" height="300" fill="#F6F4EF" stroke="#182D32" stroke-width="2"/>
  <text x="410" y="280" fill="#182D32" font-size="22" font-weight="bold" text-anchor="middle">PRESIDENTIAL LIVING &amp; DINING</text>
  <text x="410" y="310" fill="#C5A572" font-size="16" font-weight="600" text-anchor="middle">32' 0" × 20' 0"</text>
  <text x="410" y="335" fill="#586365" font-size="13" text-anchor="middle">Double-Height 22 ft. Ceiling · Imported Greek Marble</text>

  <!-- Wrap-Around Terrace with Private Plunge Pool -->
  <rect x="180" y="50" width="460" height="110" fill="#E4EAE4" stroke="#182D32" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="350" y="100" fill="#182D32" font-size="15" font-weight="bold" text-anchor="middle">WRAP-AROUND SKY TERRACE (30' × 8')</text>
  
  <rect x="520" y="60" width="110" height="90" rx="6" fill="#D7E6E5" stroke="#182D32" stroke-width="2"/>
  <text x="575" y="105" fill="#182D32" font-size="11" font-weight="bold" text-anchor="middle">PLUNGE POOL</text>
  <text x="575" y="125" fill="#586365" font-size="10" text-anchor="middle">Temperature Cntrl</text>

  <!-- Wet & Dry Gourmet Kitchens -->
  <rect x="180" y="460" width="240" height="140" fill="#FAFAF8" stroke="#182D32" stroke-width="2"/>
  <text x="300" y="520" fill="#182D32" font-size="14" font-weight="bold" text-anchor="middle">GOURMET KITCHEN</text>
  <text x="300" y="545" fill="#C5A572" font-size="13" font-weight="600" text-anchor="middle">16' 0" × 11' 6"</text>

  <rect x="420" y="460" width="220" height="140" fill="#ECEFEA" stroke="#182D32" stroke-width="2"/>
  <text x="530" y="520" fill="#182D32" font-size="13" font-weight="bold" text-anchor="middle">STAFF QUARTERS</text>
  <text x="530" y="540" fill="#586365" font-size="11" text-anchor="middle">With Separate Service Entry</text>

  <!-- Master Presidential Suite -->
  <rect x="640" y="50" width="300" height="280" fill="#F6F4EF" stroke="#182D32" stroke-width="2"/>
  <text x="790" y="150" fill="#182D32" font-size="18" font-weight="bold" text-anchor="middle">PRESIDENTIAL MASTER</text>
  <text x="790" y="175" fill="#C5A572" font-size="14" font-weight="600" text-anchor="middle">21' 0" × 16' 0"</text>
  <text x="790" y="200" fill="#586365" font-size="12" text-anchor="middle">Dressing Suite &amp; Jacuzzi Spa Bath</text>

  <!-- Suites 2, 3 & 4 -->
  <rect x="640" y="330" width="150" height="270" fill="#F6F4EF" stroke="#182D32" stroke-width="2"/>
  <text x="715" y="440" fill="#182D32" font-size="14" font-weight="bold" text-anchor="middle">SUITE 02</text>
  <text x="715" y="465" fill="#C5A572" font-size="12" font-weight="600" text-anchor="middle">15'×13' En-suite</text>

  <rect x="790" y="330" width="150" height="270" fill="#F6F4EF" stroke="#182D32" stroke-width="2"/>
  <text x="865" y="440" fill="#182D32" font-size="14" font-weight="bold" text-anchor="middle">SUITE 03 &amp; 04</text>
  <text x="865" y="465" fill="#C5A572" font-size="12" font-weight="600" text-anchor="middle">Private Balconies</text>

  <!-- Bottom Title Bar -->
  <rect x="60" y="620" width="880" height="46" rx="4" fill="#182D32"/>
  <text x="80" y="648" fill="#C5A572" font-size="15" font-weight="bold">4 BHK PRESIDENTIAL PENTHOUSE</text>
  <text x="370" y="648" fill="#F6F4EF" font-size="12">CARPET: 2,380 SQ. FT. · SUPER AREA: 3,450 SQ. FT. · PRIVATE ELEVATOR · PANORAMIC SKY TERRACE</text>
</svg>